name: vm

# Boots real cloud images with systemd/OpenRC under KVM and runs tests/vm.sh:
# both rollbacks with a dropped connection, a full run, a reboot and --undo.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"    # weekly, new point releases break things too

jobs:
  vm:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            url: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
          - name: debian-13
            url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
            docker: 1
          - name: ubuntu-22.04
            url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
          - name: ubuntu-24.04
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          - name: ubuntu-26.04
            url: https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img
          - name: almalinux-9
            url: https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
          - name: almalinux-10
            url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
          - name: fedora-45
            url: https://download.fedoraproject.org/pub/fedora/linux/releases/45/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-45-1.4.x86_64.qcow2
          - name: alpine-3.24
            url: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/alpine-3.24.4-x86_64-cloudinit-r0.qcow2
          - name: arch
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
          - name: opensuse-leap-16.0
            url: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
    steps:
      - uses: actions/checkout@v4
      - name: qemu with kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils
      - name: test
        run: tests/vm.sh "${{ matrix.url }}" "${{ matrix.name }}"
        env:
          DOCKER: ${{ matrix.docker }}
